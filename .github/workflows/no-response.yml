name: No Response

on:
  issue_comment:
    types: [created]
  # Disabled daily schedule
  # schedule:
  #   - cron: 0 4 * * *
  workflow_dispatch: # Manual trigger only

jobs:
  no-response:
    runs-on: ubuntu-latest
    steps:
      - uses: lee-dohm/no-response@9bb0a4b5e6a45046f00353d5de7d90fb8bd773bb # v0.5.0
        with:
          daysUntilClose: 1
          responseRequiredLabel: Missing Information
          token: ${{ github.token }}
